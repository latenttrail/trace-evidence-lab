<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img">
<defs><marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5B9BF8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34D399"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#F0B24A"/></marker><marker id="ar-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#FB7185"/></marker><marker id="ar-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8494A6"/></marker></defs><rect x="0" y="0" width="1200" height="1500" rx="0" fill="#0E1219" stroke="none" stroke-width="1" opacity="1"/>
<text x="64" y="82" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#34D399" text-anchor="start" letter-spacing="2.4" opacity="1">TRACE EVIDENCE</text>
<text x="64" y="138" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="42" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">Four users were paused for nine steps by a</text>
<text x="64" y="186.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="42" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">prompt none of them sent.</text>
<text x="64" y="230.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#8494A6" text-anchor="start" letter-spacing="0" opacity="1">Nothing was overloaded. Nothing errored. Somebody else arrived with a long prompt.</text><circle cx="81" cy="289.72" r="17" fill="#FB7185" stroke="none" stroke-width="1"/><text x="81" y="296.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0E1219" text-anchor="middle" letter-spacing="0" opacity="1">1</text><text x="112" y="296.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="1.5" opacity="1">FOUR CONVERSATIONS IN FLIGHT · AT STEP 40 A 4,096-TOKEN PROMPT ARRIVES</text><rect x="64" y="318.72" width="1072" height="232" rx="14" fill="#2E1620" stroke="#FB7185" stroke-width="1.6" opacity="1"/><text x="90" y="358.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#8494A6" text-anchor="start" letter-spacing="1" opacity="1">worst pause between tokens, for the users already there</text><text x="90" y="406.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#C6D2E0" text-anchor="start" letter-spacing="0" opacity="1">prefill chunked alongside decode</text><rect x="494" y="386.72" width="55.77777777777777" height="28" rx="4" fill="#34D399" stroke="none" stroke-width="1" opacity="0.85"/><text x="565.7777777777778" y="406.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="20" font-weight="700" fill="#34D399" text-anchor="start" letter-spacing="0" opacity="1">1 step</text><text x="90" y="474.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#C6D2E0" text-anchor="start" letter-spacing="0" opacity="1">prefill takes the whole step</text><rect x="494" y="454.72" width="502" height="28" rx="4" fill="#FB7185" stroke="none" stroke-width="1" opacity="0.85"/><text x="1012" y="474.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="20" font-weight="700" fill="#FB7185" text-anchor="start" letter-spacing="0" opacity="1">9 steps</text><text x="90" y="528.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">Nine steps in which nobody in flight received a single token.</text><circle cx="81" cy="591.72" r="17" fill="#F0B24A" stroke="none" stroke-width="1"/><text x="81" y="598.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0E1219" text-anchor="middle" letter-spacing="0" opacity="1">2</text><text x="112" y="598.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="1.5" opacity="1">AND IT SCALES WITH THE PROMPT, NOT WITH THE LOAD</text><rect x="64" y="620.72" width="1072" height="214" rx="14" fill="#2E2410" stroke="#F0B24A" stroke-width="1.6" opacity="1"/><text x="90" y="660.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#8494A6" text-anchor="start" letter-spacing="1" opacity="1">the new prompt</text><text x="404" y="660.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#8494A6" text-anchor="start" letter-spacing="1" opacity="1">worst pause for everyone else</text><text x="90" y="698.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" font-weight="400" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">256</text><text x="404" y="698.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" font-weight="400" fill="#8494A6" text-anchor="start" letter-spacing="0" opacity="1">2 steps</text><text x="90" y="728.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" font-weight="400" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">1,024</text><text x="404" y="728.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" font-weight="400" fill="#8494A6" text-anchor="start" letter-spacing="0" opacity="1">3 steps</text><text x="90" y="758.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" font-weight="400" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">4,096</text><text x="404" y="758.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" font-weight="400" fill="#F0B24A" text-anchor="start" letter-spacing="0" opacity="1">9 steps</text><text x="90" y="788.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" font-weight="400" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">16,384</text><text x="404" y="788.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" font-weight="700" fill="#F0B24A" text-anchor="start" letter-spacing="0" opacity="1">33 steps</text><text x="90" y="816.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#C6D2E0" text-anchor="start" letter-spacing="0" opacity="1">Concurrency did not change. Throughput did not change. One request’s prompt length did.</text><circle cx="81" cy="875.72" r="17" fill="#5B9BF8" stroke="none" stroke-width="1"/><text x="81" y="882.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0E1219" text-anchor="middle" letter-spacing="0" opacity="1">3</text><text x="112" y="882.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="1.5" opacity="1">WHY THE AVERAGES HIDE IT</text><rect x="64" y="904.72" width="1072" height="136" rx="14" fill="#141A25" stroke="#232B39" stroke-width="1.4" opacity="1"/><text x="90" y="948.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#C6D2E0" text-anchor="start" letter-spacing="0" opacity="1">The long prompt’s own numbers look fine — it was served promptly. The cost was paid by four other people, whose</text>
<text x="90" y="971.84" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#C6D2E0" text-anchor="start" letter-spacing="0" opacity="1">per-request metrics are also individually unremarkable. Chunked prefill does not delete the work; it spreads the</text>
<text x="90" y="994.96" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#C6D2E0" text-anchor="start" letter-spacing="0" opacity="1">pause instead of landing it on one turn.</text><text x="64" y="1080.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">Measure tail latency per conversation, not per request.</text><text x="64" y="1129.1200000000001" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#5F6E80" text-anchor="start" letter-spacing="0" opacity="1">Teaching miniature · simulator-derived, not Measured by us · Ankit run against sim/serving_sim.py: four 128-token prompts in flight, one long prompt at step 40, seeded and deterministic</text><text x="64" y="1153.1200000000001" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#5F6E80" text-anchor="start" letter-spacing="0" opacity="1">Steps, not milliseconds. Reproduces the interaction, not any engine. No engine is named or ranked.</text>
</svg>

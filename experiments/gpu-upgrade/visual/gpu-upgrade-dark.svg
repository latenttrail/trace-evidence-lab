<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
<title id="title">I upgraded the GPU. The response did not get meaningfully faster.</title>
<desc id="desc">A controlled serving experiment compares H100 and H200 hardware, then eager and compiled execution. The hardware swap changes inter-token latency slightly but not throughput; compiled execution changes both at the same load. The hardware diagnosis is an interpretation of the measured roofline and serving results.</desc>
<style>text{font-family:Inter,'Avenir Next','Segoe UI',system-ui,-apple-system,sans-serif}</style>
<rect width="1200" height="1500" fill="#11151D"/>
<text x="64" y="70" font-size="20" fill="#4FC49D" font-weight="800" text-anchor="start" letter-spacing="3">TRACE EVIDENCE · POST 1</text>
<text x="64" y="140" font-size="56" fill="#EEF2F8" font-weight="800" text-anchor="start" >I upgraded the GPU.</text>
<text x="64" y="204" font-size="45" fill="#EEF2F8" font-weight="800" text-anchor="start" >The response did not get meaningfully faster.</text>
<text x="64" y="252" font-size="23" fill="#93A1B6" font-weight="500" text-anchor="start" >A controlled counterfactual: same model · same load · one changed variable</text>

<g id="s1"><rect x="64" y="286" width="38" height="38" rx="19" fill="#6BA5EA" stroke="#6BA5EA" stroke-width="2"/><text x="83" y="312" font-size="19" fill="#FFFFFF" font-weight="800" text-anchor="middle" >1</text><text x="116" y="312" font-size="18" fill="#93A1B6" font-weight="700" text-anchor="start" >HARDWARE SWAP</text>
<rect x="64" y="340" width="1072" height="200" rx="24" fill="#152439" stroke="#6BA5EA" stroke-width="2"/>

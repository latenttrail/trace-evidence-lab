" stroke-linecap="round"/><path d="M328 405L352 416L328 427" fill="none" stroke="#6BA5EA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M939 390H948" stroke="#EEF2F8" stroke-width="3" stroke-linecap="round"/><path d="M1066 390H1075" stroke="#EEF2F8" stroke-width="3" stroke-linecap="round"/><path d="M939 407H948" stroke="#EEF2F8" stroke-width="3" stroke-linecap="round"/><path d="M1066 407H1075" stroke="#EEF2F8" stroke-width="3" stroke-linecap="round"/><path d="M939 424H948" stroke="#EEF2F8" stroke-width="3" stroke-linecap="round"/><path d="M1066 424H1075" stroke="#EEF2F8" stroke-width="3" stroke-linecap="round"/><path d="M939 441H948" stroke="#EEF2F8" stroke-width="3" stroke-linecap="round"/><path d="M1066 441H1075" stroke="#EEF2F8" stroke-width="3" stroke-linecap="round"/><rect x="948" y="368" width="118" height="96" rx="14" fill="#361C23" stroke="#EEF2F8" stroke-width="2"/><rect x="960" y="380" width="94" height="72" rx="9" fill="#1B212C" stroke="#EEF2F8" stroke-width="2"/><g transform="translate(994 390) scale(1.0833)" aria-label="NVIDIA"><path d="M8.948 8.798v-1.43a6.7 6.7 0 0 1 .424-.018c3.922-.124 6.493 3.374 6.493 3.374s-2.774 3.851-5.75 3.851c-.398 0-.787-.062-1.158-.185v-4.346c1.528.185 1.837.857 2.747 2.385l2.04-1.714s-1.492-1.952-4-1.952a6.016 6.016 0 0 0-.796.035m0-4.735v2.138l.424-.027c5.45-.185 9.01 4.47 9.01 4.47s-4.08 4.964-8.33 4.964c-.37 0-.733-.035-1.095-.097v1.325c.3.035.61.062.91.062 3.957 0 6.82-2.023 9.593-4.408.459.371 2.34 1.263 2.73 1.652-2.633 2.208-8.772 3.984-12.253 3.984-.335 0-.653-.018-.971-.053v1.864H24V4.063zm0 10.326v1.131c-3.657-.654-4.673-4.46-4.673-4.46s1.758-1.944 4.673-2.262v1.237H8.94c-1.528-.186-2.73 1.245-2.73 1.245s.68 2.412 2.739 3.11M2.456 10.9s2.164-3.197 6.5-3.533V6.201C4.153 6.59 0 10.653 0 10.653s2.35 6.802 8.948 7.42v-1.237c-4.84-.6-6.492-5.936-6.492-5.936z" fill="#8CC63F"/></g><text x="1007" y="446" font-size="19" fill="#EEF2F8" font-weight="800" text-anchor="middle" >H200</text><text x="1007" y="486" font-size="17" fill="#E4808F" font-weight="700" text-anchor="middle" >upgrade</text>
<text x="608" y="382" font-size="16" fill="#6BA5EA" font-weight="800" text-anchor="middle" letter-spacing="2">MEASURED RESULT</text>
<text x="608" y="424" font-size="18" fill="#93A1B6" font-weight="700" text-anchor="middle" >p95 inter-token latency</text><text x="608" y="467" font-size="35" fill="#EEF2F8" font-weight="800" text-anchor="middle" >5.7 ms  →  5.3 ms</text><text x="608" y="506" font-size="18" fill="#4FC49D" font-weight="700" text-anchor="middle" >−7% · outside the ±2% ITL variance band</text></g>

<g id="s2"><line x1="64" y1="564" x2="1136" y2="564" stroke="#28303E" stroke-width="2" />
<rect x="64" y="594" width="38" height="38" rx="19" fill="#E4808F" stroke="#E4808F" stroke-width="2"/><text x="83" y="620" font-size="19" fill="#FFFFFF" font-weight="800" text-anchor="middle" >2</text><text x="116" y="620" font-size="18" fill="#93A1B6" font-weight="700" text-anchor="start" >WHAT DID NOT MOVE</text>
<rect x="64" y="650" width="1072" height="250" rx="20" fill="#161C26" stroke="#28303E" stroke-width="2"/>
<text x="96" y="692" font-size="16" fill="#93A1B6" font-weight="800" text-anchor="start" letter-spacing="1.5">THROUGHPUT AT 400 USERS</text>
<text x="96" y="748" font-size="36" fill="#EEF2F8" font-weight="800" text-anchor="start" >16,187</text><text x="96" y="778" font-size="17" fill="#93A1B6" font-weight="600" text-anchor="start" >H100 · compiled</text>
<text x="430" y="748" font-size="36" fill="#E4808F" font-weight="800" text-anchor="start" >15,260</text><text x="430" y="778" font-size="17" fill="#93A1B6" font-weight="600" text-anchor="start" >H200 · compiled</text>
<path d="M260 738H379" fill="none" stroke="#93A1B6" stroke-width="5" stroke-linecap="round"/><path d="M371 727L395 738L371 749" fill="none" stroke="#93A1B6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="700" y="686" width="374" height="130" rx="16" fill="#361C23" stroke="#E4808F" stroke-width="2"/><text x="728" y="726" font-size="34" fill="#E4808F" font-weight="800" text-anchor="start" >−5.7%</text><text x="728" y="765" font-size="18" fill="#EEF2F8" font-weight="650" text-anchor="start" >inside the ±7% throughput band</text><text x="728" y="800" font-size="18" fill="#93A1B6" font-weight="600" text-anchor="start" >→ unchanged for this run</text>
<text x="96" y="858" font-size="22" fill="#EEF2F8" font-weight="700" text-anchor="start" >The expensive lever improved a resource, but not the response regime.</text></g>

<g id="s3"><line x1="64" y1="936" x2="1136" y2="936" stroke="#28303E" stroke-width="2" />
<rect x="64" y="966" width="38" height="38" rx="19" fill="#E2AC53" stroke="#E2AC53" stroke-width="2"/><text x="83" y="992" font-size="19" fill="#FFFFFF" font-weight="800" text-anchor="middle" >3</text><text x="116" y="992" font-size="18" fill="#93A1B6" font-weight="700" text-anchor="start" >DIAGNOSIS · DERIVED</text>
<rect x="64" y="1018" width="1072" height="188" rx="20" fill="#302511" stroke="#E2AC53" stroke-width="2"/>
<text x="96" y="1066" font-size="28" fill="#EEF2F8" font-weight="800" text-anchor="start" >Bandwidth was not the binding constraint in this workload.</text>
<text x="96" y="1108" font-size="21" fill="#93A1B6" font-weight="500" text-anchor="start" >The serving roofline points instead to dispatch, scheduling, and queue pressure</text>
<text x="96" y="1142" font-size="21" fill="#93A1B6" font-weight="500" text-anchor="start" >around each decode step. This is an interpretation, not a new measured field.</text></g>

<g id="s4"><line x1="64" y1="1218" x2="1136" y2="1218" stroke="#28303E" stroke-width="2" />
<rect x="64" y="1248" width="38" height="38" rx="19" fill="#4FC49D" stroke="#4FC49D" stroke-width="2"/><text x="83" y="1274" font-size="19" fill="#FFFFFF" font-weight="800" text-anchor="middle" >4</text><text x="116" y="1274" font-size="18" fill="#93A1B6" font-weight="700" text-anchor="start" >THE CHEAPER COUNTERFACTUAL</text>
<rect x="64" y="1290" width="1072" height="126" rx="20" fill="#10312A" stroke="#4FC49D" stroke-width="2"/>
<text x="96" y="1326" font-size="16" fill="#93A1B6" font-weight="700" text-anchor="start" >p95 inter-token latency</text><text x="600" y="1326" font-size="16" fill="#93A1B6" font-weight="700" text-anchor="start" >throughput, same load</text>
<text x="96" y="1374" font-size="30" fill="#EEF2F8" font-weight="800" text-anchor="start" >19.2 ms</text><path d="M232 1364H310" fill="none" stroke="#93A1B6" stroke-width="5" stroke-linecap="round"/><path d="M302 1353L326 1364L302 1375" fill="none" stroke="#93A1B6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="348" y="1374" font-size="30" fill="#EEF2F8" font-weight="800" text-anchor="start" >5.5 ms</text><text x="600" y="1374" font-size="30" fill="#EEF2F8" font-weight="800" text-anchor="start" >5,434  →  8,438 chunks/s</text>
<text x="96" y="1400" font-size="15" fill="#93A1B6" font-weight="700" text-anchor="start" >eager</text><text x="348" y="1400" font-size="15" fill="#4FC49D" font-weight="700" text-anchor="start" >compiled</text>
<text x="64" y="1450" font-size="25" fill="#EEF2F8" font-weight="800" text-anchor="start" >Find the bottleneck before you buy the upgrade.</text>
<text x="64" y="1478" font-size="14" fill="#93A1B6" font-weight="500" text-anchor="start" >Qwen3-VL-4B · vLLM 0.21.0 · streamed SSE chunks/s (token proxy)</text></g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img">
<defs><marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5B9BF8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34D399"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#F0B24A"/></marker><marker id="ar-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#FB7185"/></marker><marker id="ar-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8494A6"/></marker></defs><rect x="0" y="0" width="1200" height="1500" rx="0" fill="#0E1219" stroke="none" stroke-width="1" opacity="1"/>
<text x="64" y="82" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#34D399" text-anchor="start" letter-spacing="2.4" opacity="1">TRACE EVIDENCE</text>
<text x="64" y="138" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="42" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">I raised the admission limit from 8 to 32.</text>
<text x="64" y="186.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="42" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">Completions did not move once.</text>
<text x="64" y="230.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#8494A6" text-anchor="start" letter-spacing="0" opacity="1">The engine reprocessed 24,832 prompt tokens to deliver 2,409, and never ran out of work to issue.</text><circle cx="81" cy="289.72" r="17" fill="#5B9BF8" stroke="none" stroke-width="1"/><text x="81" y="296.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0E1219" text-anchor="middle" letter-spacing="0" opacity="1">1</text><text x="112" y="296.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="1.5" opacity="1">SAME LOAD, SAME CACHE, ONE SETTING CHANGED</text><rect x="64" y="318.72" width="1072" height="300" rx="14" fill="#141A25" stroke="#232B39" stroke-width="1.4" opacity="1"/><text x="90" y="358.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#8494A6" text-anchor="start" letter-spacing="1" opacity="1">max batch</text><text x="232" y="358.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#8494A6" text-anchor="start" letter-spacing="1" opacity="1">completed</text><text x="380" y="358.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#8494A6" text-anchor="start" letter-spacing="1" opacity="1">evictions</text><text x="534" y="358.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#8494A6" text-anchor="start" letter-spacing="1" opacity="1">prompt tokens re-prefilled</text><text x="90" y="406.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="19" font-weight="400" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">4</text><text x="232" y="406.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="19" font-weight="400" fill="#8494A6" text-anchor="start" letter-spacing="0" opacity="1">5</text><text x="380" y="406.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="19" font-weight="400" fill="#8494A6" text-anchor="start" letter-spacing="0" opacity="1">0</text><text x="534" y="406.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="19" font-weight="400" fill="#8494A6" text-anchor="start" letter-spacing="0" opacity="1">0</text><rect x="754" y="393.72" width="356" height="16" rx="3" fill="#232B39" stroke="none" stroke-width="1" opacity="1"/><text x="90" y="446.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="19" font-weight="400" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">8</text><text x="232" y="446.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="19" font-weight="700" fill="#34D399" text-anchor="start" letter-spacing="0" opacity="1">8</text><text x="380" y="446.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="19" font-weight="400" fill="#8494A6" text-anchor="start" letter-spacing="0" opacity="1">16</text><text x="534" y="446.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="19" font-weight="400" fill="#8494A6" text-anchor="start" letter-spacing="0" opacity="1">4,096</text><rect x="754" y="433.72" width="356" height="16" rx="3" fill="#232B39" stroke="none" stroke-width="1" opacity="1"/><rect x="754" y="433.72" width="59" height="16" rx="3" fill="#FB7185" stroke="none" stroke-width="1" opacity="1"/><text x="90" y="486.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="19" font-weight="400" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">16</text><text x="232" y="486.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="19" font-weight="700" fill="#34D399" text-anchor="start" letter-spacing="0" opacity="1">8</text><text x="380" y="486.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="19" font-weight="700" fill="#FB7185" text-anchor="start" letter-spacing="0" opacity="1">64</text><text x="534" y="486.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="19" font-weight="700" fill="#FB7185" text-anchor="start" letter-spacing="0" opacity="1">16,384</text><rect x="754" y="473.72" width="356" height="16" rx="3" fill="#232B39" stroke="none" stroke-width="1" opacity="1"/><rect x="754" y="473.72" width="235" height="16" rx="3" fill="#FB7185" stroke="none" stroke-width="1" opacity="1"/><text x="90" y="526.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="19" font-weight="400" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">24</text><text x="232" y="526.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="19" font-weight="700" fill="#34D399" text-anchor="start" letter-spacing="0" opacity="1">8</text><text x="380" y="526.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="19" font-weight="700" fill="#FB7185" text-anchor="start" letter-spacing="0" opacity="1">97</text><text x="534" y="526.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="19" font-weight="700" fill="#FB7185" text-anchor="start" letter-spacing="0" opacity="1">24,832</text><rect x="754" y="513.72" width="356" height="16" rx="3" fill="#232B39" stroke="none" stroke-width="1" opacity="1"/><rect x="754" y="513.72" width="356" height="16" rx="3" fill="#FB7185" stroke="none" stroke-width="1" opacity="1"/><text x="90" y="566.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="19" font-weight="400" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">32</text><text x="232" y="566.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="19" font-weight="700" fill="#34D399" text-anchor="start" letter-spacing="0" opacity="1">8</text><text x="380" y="566.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="19" font-weight="700" fill="#FB7185" text-anchor="start" letter-spacing="0" opacity="1">97</text><text x="534" y="566.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="19" font-weight="700" fill="#FB7185" text-anchor="start" letter-spacing="0" opacity="1">24,832</text><rect x="754" y="553.72" width="356" height="16" rx="3" fill="#232B39" stroke="none" stroke-width="1" opacity="1"/><rect x="754" y="553.72" width="356" height="16" rx="3" fill="#FB7185" stroke="none" stroke-width="1" opacity="1"/><line x1="210" y1="378.72" x2="210" y2="594.72" stroke="#232B39" stroke-width="1" stroke-linecap="butt"/><text x="90" y="602.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#C6D2E0" text-anchor="start" letter-spacing="0" opacity="1">Completions stop improving at max batch 8 and never move again. Nothing errored, and no request was rejected.</text><circle cx="81" cy="659.72" r="17" fill="#FB7185" stroke="none" stroke-width="1"/><text x="81" y="666.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0E1219" text-anchor="middle" letter-spacing="0" opacity="1">2</text><text x="112" y="666.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="1.5" opacity="1">THE WASTE IS PREFILL, NOT DECODE</text><rect x="64" y="688.72" width="1072" height="176" rx="14" fill="#2E1620" stroke="#FB7185" stroke-width="1.6" opacity="1"/><text x="90" y="734.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#8494A6" text-anchor="start" letter-spacing="0" opacity="1">decode tokens delivered</text><text x="624" y="734.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="26" font-weight="700" fill="#34D399" text-anchor="start" letter-spacing="0" opacity="1">2,409</text><text x="90" y="776.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#8494A6" text-anchor="start" letter-spacing="0" opacity="1">decode tokens generated then evicted</text><text x="624" y="776.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="26" font-weight="700" fill="#F0B24A" text-anchor="start" letter-spacing="0" opacity="1">518</text><text x="90" y="818.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#8494A6" text-anchor="start" letter-spacing="0" opacity="1">prompt tokens processed a second time</text><text x="624" y="818.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="26" font-weight="700" fill="#FB7185" text-anchor="start" letter-spacing="0" opacity="1">24,832</text><text x="90" y="846.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">Eviction sends the request back to the start of its prompt: 10.3 reprocessed per token delivered.</text><circle cx="81" cy="905.72" r="17" fill="#F0B24A" stroke="none" stroke-width="1"/><text x="81" y="912.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0E1219" text-anchor="middle" letter-spacing="0" opacity="1">3</text><text x="112" y="912.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="1.5" opacity="1">AND EACH REQUEST GETS LESS FAR BEFORE IT IS KNOCKED BACK</text><rect x="64" y="934.72" width="1072" height="200" rx="14" fill="#2E2410" stroke="#F0B24A" stroke-width="1.6" opacity="1"/><text x="90" y="970.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#8494A6" text-anchor="start" letter-spacing="1" opacity="1">decode tokens a request produces per eviction</text><text x="90" y="1004.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="16" font-weight="400" fill="#C6D2E0" text-anchor="start" letter-spacing="0" opacity="1">max batch 8</text><rect x="254" y="991.72" width="766" height="16" rx="3" fill="#232B39" stroke="none" stroke-width="1" opacity="1"/><rect x="254" y="991.72" width="766" height="16" rx="3" fill="#34D399" stroke="none" stroke-width="1" opacity="1"/><text x="1036" y="1004.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">35.9</text><text x="90" y="1035.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="16" font-weight="400" fill="#C6D2E0" text-anchor="start" letter-spacing="0" opacity="1">max batch 16</text><rect x="254" y="1022.72" width="766" height="16" rx="3" fill="#232B39" stroke="none" stroke-width="1" opacity="1"/><rect x="254" y="1022.72" width="183" height="16" rx="3" fill="#F0B24A" stroke="none" stroke-width="1" opacity="1"/><text x="1036" y="1035.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">8.6</text><text x="90" y="1066.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="16" font-weight="400" fill="#C6D2E0" text-anchor="start" letter-spacing="0" opacity="1">max batch 24</text><rect x="254" y="1053.72" width="766" height="16" rx="3" fill="#232B39" stroke="none" stroke-width="1" opacity="1"/><rect x="254" y="1053.72" width="113" height="16" rx="3" fill="#F0B24A" stroke="none" stroke-width="1" opacity="1"/><text x="1036" y="1066.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">5.3</text><text x="90" y="1097.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="16" font-weight="400" fill="#C6D2E0" text-anchor="start" letter-spacing="0" opacity="1">max batch 32</text><rect x="254" y="1084.72" width="766" height="16" rx="3" fill="#232B39" stroke="none" stroke-width="1" opacity="1"/><rect x="254" y="1084.72" width="113" height="16" rx="3" fill="#F0B24A" stroke="none" stroke-width="1" opacity="1"/><text x="1036" y="1097.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">5.3</text><text x="90" y="1120.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">The scheduler never idles: churn looks like progress. No timings modelled, not a utilisation claim.</text><circle cx="81" cy="1175.72" r="17" fill="#34D399" stroke="none" stroke-width="1"/><text x="81" y="1182.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0E1219" text-anchor="middle" letter-spacing="0" opacity="1">4</text><text x="112" y="1182.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="1.5" opacity="1">WHAT THE LIMIT SHOULD HAVE BEEN SET FROM</text><rect x="64" y="1204.72" width="1072" height="128" rx="14" fill="#0C2A22" stroke="#34D399" stroke-width="1.6" opacity="1"/><text x="90" y="1250.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">3,072</text><text x="90" y="1278.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8494A6" text-anchor="start" letter-spacing="0" opacity="1">token slots in the cache</text><text x="454" y="1250.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="30" font-weight="700" fill="#34D399" text-anchor="start" letter-spacing="0" opacity="1">12</text><text x="454" y="1278.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8494A6" text-anchor="start" letter-spacing="0" opacity="1">fit at admission</text><text x="764" y="1250.72" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="30" font-weight="700" fill="#FB7185" text-anchor="start" letter-spacing="0" opacity="1">6</text><text x="764" y="1278.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8494A6" text-anchor="start" letter-spacing="0" opacity="1">fit at completion</text><text x="90" y="1314.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">A request grows for as long as it runs. Admission reads the first number; the system is bound by the second.</text><text x="64" y="1368.72" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1">Admission control is not a queue-length problem. It is a memory problem.</text><text x="64" y="1417.1200000000001" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#5F6E80" text-anchor="start" letter-spacing="0" opacity="1">Teaching miniature · simulator-derived. sim/serving_sim.py: 192 blocks of 16, 24 requests, 256-token prompts,</text><text x="64" y="1441.1200000000001" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#5F6E80" text-anchor="start" letter-spacing="0" opacity="1">200-token outputs, seeded. Steps, not milliseconds. Prefill and decode never summed. No engine named or ranked.</text>
</svg>
